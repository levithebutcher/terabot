<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TeraBot Cloud Explorer</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Google Fonts: Outfit, Plus Jakarta Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Modular Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient top glow -->
  <div class="ambient-glow"></div>

  <!-- Modern App Header -->
  <header>
    <div class="top-row">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div class="brand-text">
          <div class="brand-title">TeraBot Explorer</div>
          <div class="brand-subtitle">
            <span class="status-dot"></span>
            <span id="networkStatus">Telegram Cloud</span>
          </div>
        </div>
      </div>
      <div class="top-actions">
        <div id="statCounter" class="stats-pill">
          <span>0 Files</span>
        </div>
      </div>
    </div>

    <!-- Interactive Breadcrumbs -->
    <div id="breadcrumbs" class="breadcrumbs-bar">
      <div class="crumb-pill active" onclick="navigateBreadcrumb('root')">
        <span>🏠 Root</span>
      </div>
    </div>

    <!-- Search & Filter Controls -->
    <div class="toolbar">
      <div class="search-row">
        <div class="search-container">
          <svg class="search-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Search in this folder..." oninput="handleSearch(this.value)">
          <button id="searchClearBtn" class="search-clear-btn" onclick="clearSearch()">✕</button>
        </div>
        <select id="sortSelect" class="sort-dropdown" onchange="handleSort(this.value)">
          <option value="size_desc">Size ⬇️</option>
          <option value="size_asc">Size ⬆️</option>
          <option value="name_asc">Name A-Z</option>
          <option value="name_desc">Name Z-A</option>
        </select>
      </div>

      <!-- Type Filter Chips with Live Counters -->
      <div class="filter-chips">
        <button class="chip-btn active" onclick="setFilter('all', this)">
          <span>All</span>
          <span id="chipCountAll" class="chip-count">0</span>
        </button>
        <button class="chip-btn" onclick="setFilter('video', this)">
          <span>🎬 Videos</span>
          <span id="chipCountVideo" class="chip-count">0</span>
        </button>
        <button class="chip-btn" onclick="setFilter('photo', this)">
          <span>🖼️ Photos</span>
          <span id="chipCountPhoto" class="chip-count">0</span>
        </button>
        <button class="chip-btn" onclick="setFilter('other', this)">
          <span>📄 Docs & Other</span>
          <span id="chipCountOther" class="chip-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Explorer View -->
  <main id="mainContent">
    <div class="skeleton-wrap">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </main>

  <!-- Floating Sticky Action Bar (Desktop / Fallback) -->
  <div id="bottomBar" class="floating-bar">
    <div class="bar-info">
      <div id="barCount" class="bar-count">0 Selected</div>
      <div id="barSize" class="bar-size">0 MB Total</div>
    </div>
    <div class="bar-buttons">
      <button class="clear-selection-btn" onclick="clearAllSelections()">✕ Clear</button>
      <button id="downloadBtn" class="download-cta-btn" onclick="submitDownload()">
        <span>🚀 Download</span>
      </button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toastPill" class="toast-pill">
    <span id="toastIcon">✨</span>
    <span id="toastMsg">Notification</span>
  </div>

  <!-- File Detail Sheet Modal -->
  <div id="detailModal" class="modal-overlay" onclick="closeDetailModal(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <div id="modalFileName" class="modal-file-title">File Details</div>
      <div class="modal-grid">
        <div class="modal-field">
          <div class="modal-label">File Size</div>
          <div id="modalFileSize" class="modal-val">0 MB</div>
        </div>
        <div class="modal-field">
          <div class="modal-label">File Type</div>
          <div id="modalFileType" class="modal-val">Video</div>
        </div>
        <div class="modal-field">
          <div class="modal-label">Extension</div>
          <div id="modalFileExt" class="modal-val">.mp4</div>
        </div>
        <div class="modal-field">
          <div class="modal-label">Handle ID</div>
          <div id="modalFileHandle" class="modal-val">--</div>
        </div>
      </div>
      <button class="modal-close-btn" onclick="closeDetailModal()">Done</button>
    </div>
  </div>

  <!-- Modular Application Logic -->
  <script src="app.js"></script>
</body>
</html>
